name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Byte-compile Python sources
        run: python -m compileall -q app.py core backends tests

      - name: Run tests
        run: python -m pytest tests -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check inline template JavaScript
        run: python tests/check_template_js.py

name: Release Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (optional, without v). For tags leave empty."
        required: false
        default: ""
      upload_to_tag:
        description: "Existing tag to upload packages to (e.g. v1.3.0). Optional."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: amd64
            artifact_ext: tar.gz
          # Apple Silicon (current GitHub macos-latest)
          - os: macos-latest
            platform: macos
            arch: arm64
            artifact_ext: tar.gz
          # Intel mac — use macos-13 only when available; keep fail-fast false
          - os: macos-13
            platform: macos
            arch: amd64
            artifact_ext: tar.gz
          - os: windows-latest
            platform: windows
            arch: amd64
            artifact_ext: zip

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.0"

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V="$(tr -d '[:space:]' < VERSION)"
          fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "$V" > VERSION
          echo "Building version $V"

      - name: Build binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash scripts/build_package.sh
          ls -la dist/packages/

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build_package.ps1
          Get-ChildItem dist/packages/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-switch-${{ steps.ver.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    # Run even if some matrix cells fail/cancel, as long as workflow isn't fully cancelled
    # and at least we may have partial artifacts.
    if: |
      always()
      && !cancelled()
      && (
        startsWith(github.ref, 'refs/tags/v')
        || github.event.inputs.upload_to_tag != ''
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.upload_to_tag }}" ]; then
            T="${{ github.event.inputs.upload_to_tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            T="${GITHUB_REF#refs/tags/}"
          else
            V="$(tr -d '[:space:]' < VERSION)"
            T="v${V#v}"
          fi
          [[ "$T" == v* ]] || T="v$T"
          echo "tag=$T" >> "$GITHUB_OUTPUT"
          echo "Release tag: $T"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
        continue-on-error: true

      - name: Flatten assets
        id: assets
        shell: bash
        run: |
          mkdir -p upload
          if [ -d release-assets ]; then
            find release-assets -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp -f {} upload/ \;
          fi
          echo "Packages to upload:"
          ls -lah upload/ || true
          count=$(find upload -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" = "0" ]; then
            echo "::error::No package artifacts found to attach"
            exit 1
          fi

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: upload/*
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
